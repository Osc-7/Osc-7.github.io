services:
  jekyll-site:
    image: jekyll-site
    build: .
    volumes:
      - .:/usr/src/app
      - jekyll-bundle:/usr/local/bundle
    ports: [ 4000:4000 ]
    user: root
    environment:
      # Prevent `jekyll serve -H 0.0.0.0` from rewriting site.url to 0.0.0.0
      JEKYLL_ENV: production
      BUNDLE_PATH: /usr/local/bundle
      BUNDLE_APP_CONFIG: /tmp/bundle-config
    command: >
      bash -lc "bundle install &&
      bundle exec jekyll serve -H 0.0.0.0 -w --config _config.yml,_config.dev.yml"

volumes:
  jekyll-bundle:
