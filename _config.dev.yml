# Local preview overrides — used with:
#   bundle exec jekyll serve --config _config.yml,_config.dev.yml
#   docker compose (see docker-compose.yaml)
#
# Without this, jekyll serve -H 0.0.0.0 rewrites asset URLs to
# http://0.0.0.0:4000/... which browsers block when you open localhost.
url: "http://localhost:4000"
baseurl: ""
